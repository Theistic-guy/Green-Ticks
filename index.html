<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Green-Ticks</title>
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
    <!-- You can change 'vue.css' to 'buble.css', 'dark.css', or 'pure.css' for different themes -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
    <style>
      /* Collapsible sidebar sections */
      .sidebar-nav > ul > li > ul {
        display: none;
      }
      .sidebar-nav > ul > li.open > ul {
        display: block;
      }
      .sidebar-nav > ul > li > strong,
      .sidebar-nav > ul > li > p > strong {
        cursor: pointer;
        display: block;
        padding: 4px 0;
        user-select: none;
      }
      .sidebar-nav > ul > li > strong::before,
      .sidebar-nav > ul > li > p > strong::before {
        content: '▸ ';
        font-size: 0.8em;
      }
      .sidebar-nav > ul > li.open > strong::before,
      .sidebar-nav > ul > li.open > p > strong::before {
        content: '▾ ';
        font-size: 0.8em;
      }
    </style>
</head>

<body>
    <div id="app"></div>
    <script>
        // 0. Patch querySelector to prevent Docsify from crashing on IDs that start with numbers
        // Docsify internally uses document.querySelector('#' + id) for scrolling, which throws a DOMException
        // if the ID starts with a number. This intercepts the crash and uses getElementById.
        var origQuerySelector = document.querySelector;
        document.querySelector = function(selectors) {
            try {
                return origQuerySelector.call(this, selectors);
            } catch (err) {
                if (typeof selectors === 'string' && selectors.startsWith('#')) {
                    var el = document.getElementById(selectors.slice(1));
                    if (el) return el;
                }
                throw err;
            }
        };
        var origElementQuerySelector = Element.prototype.querySelector;
        Element.prototype.querySelector = function(selectors) {
            try {
                return origElementQuerySelector.call(this, selectors);
            } catch (err) {
                if (typeof selectors === 'string' && selectors.startsWith('#')) {
                    var el = document.getElementById(selectors.slice(1));
                    if (el) return el;
                }
                throw err;
            }
        };

        function customSlugify(text) {
            if (!text) return '';
            try {
                text = decodeURIComponent(text);
            } catch (e) {}
            return text
                .toLowerCase()
                .replace(/<(?:.|\n)*?>/gm, '') // Strips HTML tags
                .replace(/[^\w\s-]/g, '')     // Strips punctuation, emojis, quotes, brackets
                .trim()
                .replace(/\s+/g, '-');         // Replaces whitespace sequences with hyphens
        }
        customSlugify.clear = function() {}; // Search plugin expects slugify.clear() to exist

        // Helper to locate a heading element by any variation of its ID or title
        function findHeading(target) {
            if (!target) return null;
            target = target.trim();
            var decoded = target;
            try {
                decoded = decodeURIComponent(target).trim();
            } catch (e) {}
            var cleanSlug = customSlugify(decoded);

            // 1. Direct getElementById
            var el = document.getElementById(cleanSlug) ||
                     document.getElementById(target) ||
                     document.getElementById(decoded);
            if (el) return el;

            // 2. Query selector with CSS.escape if available
            try {
                if (window.CSS && window.CSS.escape) {
                    el = origQuerySelector.call(document, '#' + CSS.escape(cleanSlug)) ||
                         origQuerySelector.call(document, '#' + CSS.escape(decoded));
                    if (el) return el;
                }
            } catch (e) {}

            // 3. Scan all headings in the page by text or slug
            var headings = document.querySelectorAll('h1, h2, h3, h4, h5, h6');
            for (var i = 0; i < headings.length; i++) {
                var h = headings[i];
                var text = (h.innerText || h.textContent || '').trim();
                var hSlug = customSlugify(text);
                if (h.id === cleanSlug || hSlug === cleanSlug || text.toLowerCase() === decoded.toLowerCase()) {
                    return h;
                }
            }
            return null;
        }

        // 2. Docsify plugin to parse Obsidian & Markdown heading links before rendering
        function obsidianHeadingLinksPlugin(hook, vm) {
            
            // Ensure Docsify uses our slugify everywhere (sidebar + headings) before rendering
            hook.init(function() {
                if (window.Docsify) {
                    window.Docsify.slugify = customSlugify;
                }
            });

            hook.beforeEach(function (content) {
                if (!content) return content;

                // A. Convert Obsidian wikilinks: [[Note#Heading|Display]], [[Note#Heading]], [[#Heading]]
                content = content.replace(/\[\[([^\]#|]+)?(?:#([^\]|]+))?(?:\|([^\]]+))?\]\]/g, function (match, file, heading, alias) {
                    file = (file || '').trim();
                    heading = (heading || '').trim();
                    alias = (alias || '').trim();

                    var slug = heading ? customSlugify(heading) : '';
                    var displayText = alias || (file && heading ? (file + ' > ' + heading) : (heading || file));

                    var target = '';
                    if (file) {
                        var filePath = file.endsWith('.md') ? file : file + '.md';
                        // CROSS-PAGE requires ?id= for Docsify relative router to parse correctly
                        target = slug ? (filePath + '?id=' + slug) : filePath;
                    } else if (slug) {
                        // IN-PAGE requires # so docsify treats it natively
                        target = '#' + slug;
                    } else {
                        return displayText;
                    }

                    return '[' + displayText + '](' + target + ')';
                });

                // B. Process standard Markdown links with anchors: [Text](path.md#heading) or [Text](#heading)
                content = content.replace(/\[([^\]]+)\]\(([^)]+)\)/g, function (match, text, url) {
                    url = url.trim();
                    if (/^(?:https?:|\/\/|mailto:)/i.test(url)) {
                        return match;
                    }

                    var hashIndex = url.indexOf('#');
                    if (hashIndex !== -1) {
                        var filePart = url.substring(0, hashIndex).trim();
                        var hashPart = url.substring(hashIndex + 1).trim();
                        if (!hashPart) return match;

                        var slug = customSlugify(hashPart);
                        // CROSS-PAGE: ?id=
                        // IN-PAGE: #
                        var newUrl = filePart ? (filePart + '?id=' + slug) : ('#' + slug);
                        return '[' + text + '](' + newUrl + ')';
                    }
                    return match;
                });

                // C. Process HTML <a> tags with hashes: <a href="...#...">
                content = content.replace(/<a\s+([^>]*?)href=(["'])(.*?)\2([^>]*)>/gi, function (match, before, quote, href, after) {
                    href = href.trim();
                    if (/^(?:https?:|\/\/|mailto:)/i.test(href)) {
                        return match;
                    }
                    var hashIndex = href.indexOf('#');
                    if (hashIndex !== -1) {
                        var filePart = href.substring(0, hashIndex).trim();
                        var hashPart = href.substring(hashIndex + 1).trim();
                        if (!hashPart) return match;

                        var slug = customSlugify(hashPart);
                        // CROSS-PAGE: ?id=
                        // IN-PAGE: #
                        var newHref = filePart ? (filePart + '?id=' + slug) : ('#' + slug);
                        return '<a ' + before + 'href=' + quote + newHref + quote + after + '>';
                    }
                    return match;
                });

                // D. Resolve relative paths (../ and ./) in markdown links
                // Required because relativePath is disabled for search/TOC compatibility
                var currentFile = (vm.route && vm.route.file) || '';
                var currentDir = currentFile.substring(0, currentFile.lastIndexOf('/') + 1);
                if (currentDir) {
                    content = content.replace(/\[([^\]]+)\]\(([^)]+)\)/g, function (match, text, url) {
                        url = url.trim();
                        if (/^(?:https?:|\/\/|mailto:|\/|#|\?)/i.test(url)) return match;
                        if (!url.startsWith('../') && !url.startsWith('./')) return match;
                        var qIdx = url.indexOf('?');
                        var pathPart = qIdx >= 0 ? url.substring(0, qIdx) : url;
                        var queryPart = qIdx >= 0 ? url.substring(qIdx) : '';
                        var segments = currentDir.split('/').filter(Boolean);
                        pathPart.split('/').forEach(function (seg) {
                            if (seg === '..') segments.pop();
                            else if (seg !== '.' && seg !== '') segments.push(seg);
                        });
                        return '[' + text + '](/' + segments.join('/') + queryPart + ')';
                    });

                    // E. Resolve relative paths in HTML <a> hrefs
                    content = content.replace(/<a\s+([^>]*?)href=(["'])(.*?)\2([^>]*)>/gi, function (match, before, quote, href, after) {
                        href = href.trim();
                        if (/^(?:https?:|\/\/|mailto:|\/|#|\?)/i.test(href)) return match;
                        if (!href.startsWith('../') && !href.startsWith('./')) return match;
                        var qIdx = href.indexOf('?');
                        var pathPart = qIdx >= 0 ? href.substring(0, qIdx) : href;
                        var queryPart = qIdx >= 0 ? href.substring(qIdx) : '';
                        var segments = currentDir.split('/').filter(Boolean);
                        pathPart.split('/').forEach(function (seg) {
                            if (seg === '..') segments.pop();
                            else if (seg !== '.' && seg !== '') segments.push(seg);
                        });
                        return '<a ' + before + 'href=' + quote + '/' + segments.join('/') + queryPart + quote + after + '>';
                    });
                }

                return content;
            });

            // Handle smooth scrolling after DOM rendering
            hook.doneEach(function () {
                var id = vm.route.query && vm.route.query.id;
                if (id) {
                    var el = findHeading(id);
                    if (el) {
                        setTimeout(function () {
                            el.scrollIntoView({ behavior: 'smooth' });
                        }, 120);
                    }
                }
            });
        }

        window.$docsify = {
            name: 'Green-Ticks',
            repo: 'https://github.com/Theistic-guy/Green-Ticks',
            loadSidebar: true,
            subMaxLevel: 3,
            search: {
                maxAge: 86400000,
                paths: 'auto',
                placeholder: 'Search...',
                noData: 'No Results!',
                depth: 6,
                hideOtherSidebarContent: false
            },
            plugins: [
                obsidianHeadingLinksPlugin
            ]
        };

        // Capture in-page heading clicks before Docsify router can misroute or crash
        document.addEventListener('click', function (e) {
            var a = e.target.closest('a');
            if (!a) return;
            var href = a.getAttribute('href');
            if (!href || /^(https?:|\/\/|mailto:)/i.test(href)) return;

            var currentRoute = (window.location.hash || '#/').split('?')[0];

            // 1. Pure hash link natively inserted by Docsify or us (e.g. <a href="#slug">)
            if (href.startsWith('#') && !href.startsWith('#/')) {
                var rawId = href.slice(1);
                var el = findHeading(rawId);
                if (el) {
                    e.preventDefault();
                    e.stopPropagation();
                    el.scrollIntoView({ behavior: 'smooth' });
                    history.pushState(null, '', currentRoute + '?id=' + customSlugify(rawId));
                }
                return;
            }

            // 2. Docsify router link strictly to the SAME page (e.g. <a href="#/CurrentPage?id=slug">)
            if (href.startsWith(currentRoute + '?id=')) {
                var rawId = href.substring((currentRoute + '?id=').length);
                var el = findHeading(rawId);
                if (el) {
                    e.preventDefault();
                    e.stopPropagation();
                    el.scrollIntoView({ behavior: 'smooth' });
                    history.pushState(null, '', href);
                }
                return;
            }
        }, true);
    </script>
    <script src="https://cdn.jsdelivr.net/npm/docsify@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
    <script>
      // Collapsible sidebar with persistent open/close state
      var openSections = {};

      function sidebarCollapsePlugin(hook) {
        hook.doneEach(function () {
          var nav = document.querySelector('.sidebar-nav');
          if (!nav) return;
          var items = nav.querySelectorAll(':scope > ul > li');
          items.forEach(function (li) {
            var strong = li.querySelector(':scope > strong, :scope > p > strong');
            var subList = li.querySelector(':scope > ul');
            if (strong && subList) {
              var name = strong.textContent.trim();

              // Auto-open if this section contains the active link
              if (subList.querySelector('.active')) {
                li.classList.add('open');
                openSections[name] = true;
              }
              // Restore previously opened sections
              else if (openSections[name]) {
                li.classList.add('open');
              }

              strong.addEventListener('click', function (e) {
                e.preventDefault();
                e.stopPropagation();
                li.classList.toggle('open');
                openSections[name] = li.classList.contains('open');
              });
            }
          });
        });
      }

      if (!window.$docsify) window.$docsify = {};
      window.$docsify.plugins = (window.$docsify.plugins || []).concat(sidebarCollapsePlugin);
    </script>
</body>

</html>
