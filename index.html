<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Green-Ticks</title>
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
    <!-- You can change 'vue.css' to 'buble.css', 'dark.css', or 'pure.css' for different themes -->
    <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
</head>

<body>
    <div id="app"></div>
    <script>
        // 1. Unified slugify function for both heading IDs and link anchors
        function customSlugify(text) {
            if (!text) return '';
            try {
                text = decodeURIComponent(text);
            } catch (e) {}
            return text
                .toLowerCase()
                .replace(/<(?:.|\n)*?>/gm, '') // Strips HTML tags (e.g. <span>)
                .replace(/[^\w\s-]/g, '')     // Strips punctuation, periods, emojis (⭐), quotes, brackets
                .trim()                        // Removes leading/trailing spaces
                .replace(/\s+/g, '-');         // Replaces whitespace sequences with hyphens
        }

        // Helper to locate a heading element by any variation of its ID or title
        function findHeading(target) {
            if (!target) return null;
            target = target.trim();
            var decoded = target;
            try {
                decoded = decodeURIComponent(target).trim();
            } catch (e) {}
            var cleanSlug = customSlugify(decoded);

            // 1. Direct getElementById
            var el = document.getElementById(cleanSlug) ||
                     document.getElementById(target) ||
                     document.getElementById(decoded);
            if (el) return el;

            // 2. Query selector with CSS.escape if available
            try {
                if (window.CSS && window.CSS.escape) {
                    el = document.querySelector('#' + CSS.escape(cleanSlug)) ||
                         document.querySelector('#' + CSS.escape(decoded));
                    if (el) return el;
                }
            } catch (e) {}

            // 3. Scan all headings in the page by text or slug
            var headings = document.querySelectorAll('h1, h2, h3, h4, h5, h6');
            for (var i = 0; i < headings.length; i++) {
                var h = headings[i];
                var text = (h.innerText || h.textContent || '').trim();
                var hSlug = customSlugify(text);
                if (h.id === cleanSlug || hSlug === cleanSlug || text.toLowerCase() === decoded.toLowerCase()) {
                    return h;
                }
            }
            return null;
        }

        // 2. Docsify plugin to parse Obsidian & Markdown heading links before rendering
        function obsidianHeadingLinksPlugin(hook, vm) {
            hook.beforeEach(function (content) {
                if (!content) return content;

                // A. Convert Obsidian wikilinks: [[Note#Heading|Display]], [[Note#Heading]], [[#Heading]], [[Note]]
                content = content.replace(/\[\[([^\]#|]+)?(?:#([^\]|]+))?(?:\|([^\]]+))?\]\]/g, function (match, file, heading, alias) {
                    file = (file || '').trim();
                    heading = (heading || '').trim();
                    alias = (alias || '').trim();

                    var slug = heading ? customSlugify(heading) : '';
                    var displayText = alias || (file && heading ? (file + ' > ' + heading) : (heading || file));

                    var target = '';
                    if (file) {
                        var filePath = file.endsWith('.md') ? file : file + '.md';
                        target = slug ? (filePath + '#' + slug) : filePath;
                    } else if (slug) {
                        target = '#' + slug;
                    } else {
                        return displayText;
                    }

                    return '[' + displayText + '](' + target + ')';
                });

                // B. Process standard Markdown links with anchors: [Text](path.md#heading) or [Text](#heading)
                content = content.replace(/\[([^\]]+)\]\(([^)]+)\)/g, function (match, text, url) {
                    url = url.trim();
                    if (/^(?:https?:|\/\/|mailto:)/i.test(url)) {
                        return match;
                    }

                    var hashIndex = url.indexOf('#');
                    if (hashIndex !== -1) {
                        var filePart = url.substring(0, hashIndex).trim();
                        var hashPart = url.substring(hashIndex + 1).trim();
                        if (!hashPart) return match;

                        var slug = customSlugify(hashPart);
                        var newUrl = filePart ? (filePart + '#' + slug) : ('#' + slug);
                        return '[' + text + '](' + newUrl + ')';
                    }
                    return match;
                });

                // C. Process HTML <a> tags with hashes: <a href="...#...">
                content = content.replace(/<a\s+([^>]*?)href=(["'])(.*?)\2([^>]*)>/gi, function (match, before, quote, href, after) {
                    href = href.trim();
                    if (/^(?:https?:|\/\/|mailto:)/i.test(href)) {
                        return match;
                    }
                    var hashIndex = href.indexOf('#');
                    if (hashIndex !== -1) {
                        var filePart = href.substring(0, hashIndex).trim();
                        var hashPart = href.substring(hashIndex + 1).trim();
                        if (!hashPart) return match;

                        var slug = customSlugify(hashPart);
                        var newHref = filePart ? (filePart + '#' + slug) : ('#' + slug);
                        return '<a ' + before + 'href=' + quote + newHref + quote + after + '>';
                    }
                    return match;
                });

                return content;
            });

            // Handle smooth scrolling after DOM rendering
            hook.doneEach(function () {
                var id = vm.route.query && vm.route.query.id;
                if (id) {
                    var el = findHeading(id);
                    if (el) {
                        setTimeout(function () {
                            el.scrollIntoView({ behavior: 'smooth' });
                        }, 120);
                    }
                }
            });
        }

        window.$docsify = {
            name: 'Green-Ticks',
            repo: 'https://github.com/Theistic-guy/Green-Ticks',
            loadSidebar: true,
            subMaxLevel: 2,
            relativePath: true,
            plugins: [
                obsidianHeadingLinksPlugin
            ]
        };

        // Capture in-page heading clicks before Docsify router can misroute
        document.addEventListener('click', function (e) {
            var a = e.target.closest('a');
            if (!a) return;
            var href = a.getAttribute('href');
            if (!href || /^(https?:|\/\/|mailto:)/i.test(href)) return;

            var queryIdMatch = href.match(/[?&]id=([^&#]+)/);
            var hashIndex = href.indexOf('#');
            var rawId = null;

            if (queryIdMatch) {
                rawId = queryIdMatch[1];
            } else if (hashIndex !== -1) {
                rawId = href.substring(hashIndex + 1);
                if (rawId.startsWith('/')) {
                    var innerMatch = rawId.match(/[?&]id=([^&#]+)/);
                    rawId = innerMatch ? innerMatch[1] : null;
                }
            }

            if (!rawId) return;

            var currentHash = (window.location.hash || '').split('?')[0];
            var linkBase = href.split('?')[0].split('#')[0];
            var isSamePage = !linkBase || href.startsWith('#') || href.startsWith('?id=') || (currentHash && href.indexOf(currentHash) !== -1);

            if (isSamePage) {
                var el = findHeading(rawId);
                if (el) {
                    e.preventDefault();
                    e.stopPropagation();
                    el.scrollIntoView({ behavior: 'smooth' });
                    var slug = customSlugify(rawId);
                    var baseHash = (window.location.hash || '#/').split('?')[0];
                    history.pushState(null, '', baseHash + '?id=' + slug);
                }
            }
        }, true);
    </script>
    <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
    <script>
        // 3. Post-load initialization for Docsify runtime
        if (window.Docsify) {
            // Override Docsify's internal slugify with customSlugify
            window.Docsify.slugify = customSlugify;

            // Safe-guard Docsify.dom.find against invalid CSS selectors (e.g. IDs starting with numbers)
            if (window.Docsify.dom && window.Docsify.dom.find) {
                var origFind = window.Docsify.dom.find;
                window.Docsify.dom.find = function (el, node) {
                    try {
                        return origFind(el, node);
                    } catch (err) {
                        if (typeof el === 'string' && el.startsWith('#')) {
                            return document.getElementById(el.slice(1)) || findHeading(el.slice(1));
                        }
                        return null;
                    }
                };
            }
        }
    </script>
</body>

</html>
