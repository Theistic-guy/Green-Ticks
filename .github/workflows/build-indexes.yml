name: Build indexes

on:
  workflow_dispatch:
  push:
    paths:
      - "Problems/**/*.md"
      - "scripts/build_indexes.py"
      - "SCHEMA.md"
      - ".github/workflows/build-indexes.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Generate indexes and README
        run: python scripts/build_indexes.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Only stage what we specifically want the bot to touch
          git add Topics Platforms Companies Difficulty "Miscellaneous Tags" README.md

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Auto-update indexes and README"
          git pull --rebase
          git push
